project:
  type: book
  output-dir: _site
  pre-render: scripts/combine-firms.sh
  resources:
    - images
    - data/firms-combined.json


book:
  title: "STRAT 325 - Intro to Management Consulting"
  favicon: favicon.svg
  author: "Scott Murff"
  date: "Winter 2026"
  chapters:
    - part: "Course Info"
      chapters:
        - index.qmd
        - 00-assessments.qmd
    - part: "Foundation"
      chapters:
        - 01-what-is-consulting.qmd
        - 02-consultant-diamond.qmd
        - 03-leveraging-ai.qmd
        - 04-working-as-a-team.qmd
    - part: "The Four Axes"
      chapters:
        - 05-structured-problem-solving.qmd
        - 06-analytics-modeling.qmd
        - 07-ownership.qmd
        - 08-communication.qmd
        - 09-collaboration.qmd
    - part: "Resources"
      chapters:
        - 95-antigravity-reference.qmd
        - 96-firms-guide.qmd
        - 97-ta-handbook.qmd
        - 98-resources.qmd
        - 99-references.qmd

bibliography: references.bib
# csl: informs.csl

format:
  html:
    theme:
      - cosmo
      - custom.scss
    include-before-body: _header.html
    include-after-body: _footer.html
    mainfont: Inter
    monofont: JetBrains Mono
    fontsize: 1rem
    linestretch: 1.7
    link-external-icon: false
    link-external-newwindow: true
    number-sections: false

toc-title: On this page

number-sections: true
